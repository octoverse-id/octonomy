version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Update uv.lock only; never rewrite the constraints in pyproject.toml.
    #
    # pip's default strategy ("auto") widens ranges for an application, which
    # produced PRs #92 and #94: `django <5.3 -> <6.1` and `gunicorn <24.0 -> <27.0`.
    # Those upper bounds are deliberate, not incidental — <5.3 is what holds the
    # project on the Django 5.2 LTS line (README, the 3.0.0 CHANGELOG entry, and
    # docs/versioning.md, which makes a minimum-Django change a major bump). A
    # range widening also passes CI misleadingly: it leaves uv.lock untouched, so
    # `uv sync` installs the already-locked versions and the suite never exercises
    # the newly-permitted ones. The break would surface later, on whatever
    # unrelated PR next runs `uv lock --upgrade`.
    #
    # lockfile-only keeps security and patch updates flowing while leaving the
    # supported-version contract a human decision, made per docs/versioning.md.
    versioning-strategy: lockfile-only
    # Bundle minor + patch bumps into a single PR. Major bumps still arrive as
    # their own PRs so they get individual review.
    groups:
      python-packages:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    # The github-actions ecosystem scans `<directory>/.github/workflows/*.y*ml` plus an
    # `action.y*ml` at the directory itself — a nested composite action needs its own
    # entry or its pins are never updated. Without the second path here, the four
    # SHA-pinned actions in .github/actions/build-publish/action.yml stay frozen while
    # that file's own comment claims Dependabot keeps them current — and that is the one
    # action running with `packages: write` and `id-token: write`.
    directories:
      - "/"
      - "/.github/actions/build-publish"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    # Same policy as python-packages above: bundle minor + patch, leave majors as
    # individual PRs. Without update-types a major lands inside the group PR (PR #121
    # bundled two: setup-buildx v3->v4 and build-push v6->v7), which forces a security
    # patch and an unreviewed major to be accepted or rejected as one unit.
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # Keep the Dockerfile base image (pinned by digest) patched with security updates.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
