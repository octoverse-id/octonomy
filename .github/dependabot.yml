version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Update uv.lock only; never rewrite the constraints in pyproject.toml.
    #
    # pip's default strategy ("auto") widens ranges for an application, which
    # produced PRs #92 and #94: `django <5.3 -> <6.1` and `gunicorn <24.0 -> <27.0`.
    # Those upper bounds are deliberate, not incidental — <5.3 is what holds the
    # project on the Django 5.2 LTS line (README, the 3.0.0 CHANGELOG entry, and
    # docs/versioning.md, which makes a minimum-Django change a major bump). A
    # range widening also passes CI misleadingly: it leaves uv.lock untouched, so
    # `uv sync` installs the already-locked versions and the suite never exercises
    # the newly-permitted ones. The break would surface later, on whatever
    # unrelated PR next runs `uv lock --upgrade`.
    #
    # lockfile-only keeps security and patch updates flowing while leaving the
    # supported-version contract a human decision, made per docs/versioning.md.
    versioning-strategy: lockfile-only
    # Bundle minor + patch bumps into a single PR. Major bumps still arrive as
    # their own PRs so they get individual review.
    groups:
      python-packages:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"

  # Keep the Dockerfile base image (pinned by digest) patched with security updates.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
