name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # Every job sets an explicit timeout. The default is 360 minutes, and `docker` and
    # the test jobs are required status checks (.github/rulesets/main-require-pr-green-ci.json)
    # — a hung step there blocks the branch for six hours, and `cancel-in-progress`
    # above means a re-push just restarts that clock instead of surfacing a failure.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Lint GitHub Actions workflows
        # actionlint validates workflow syntax and expressions and, via the shellcheck
        # preinstalled on the runner, the shell in `run:` steps — catching malformed
        # workflows and shell mistakes in review instead of after merge. Installed with
        # `go install` at a pinned version (checksum-verified against the Go module
        # database — no curl|bash); Go is preinstalled on ubuntu-latest.
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:////tmp/octonomy-check.sqlite3
      SERVICE_TOKEN_PEPPER: ci-pepper
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Django system checks
        run: uv run python manage.py check
      - name: Migration drift check
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Static-serving drift check
        # Text-level only: it asserts each deploy channel still declares HOW static is
        # served, and that none has grown a mount hiding the assets baked into the image.
        # It proves nothing about an HTTP response — that is the `docker` job's step.
        run: make static-check
      - name: OpenAPI contract drift check
        run: |
          uv run python manage.py spectacular --api-version v1 --file docs/openapi.yaml --format openapi
          uv run python manage.py spectacular --api-version v2 --file docs/openapi-v2.yaml --format openapi
          git diff --exit-code docs/openapi.yaml docs/openapi-v2.yaml

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Dependency audit
        run: uv export --format requirements-txt --no-emit-project --frozen | uv run pip-audit --no-deps -r /dev/stdin

  test-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite:////tmp/octonomy-ci.sqlite3
      SERVICE_TOKEN_PEPPER: ci-pepper
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run SQLite tests
        run: uv run pytest --cov-fail-under=90

  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: octonomy
          POSTGRES_PASSWORD: octonomy
          POSTGRES_DB: octonomy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U octonomy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://octonomy:octonomy@localhost:5432/octonomy
      SERVICE_TOKEN_PEPPER: ci-pepper
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run PostgreSQL tests
        run: uv run pytest --cov-fail-under=90

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This job must NEVER hold a registry credential. ci.yml runs on `pull_request`,
    # so a fork PR triggers it; keeping permissions at `contents: read` and never
    # logging into any registry is what lets the DEP-1 publish workflow safely gate
    # on this one. Build only — the publish path lives in publish-image.yml.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # SHA-pinned, and deliberately to the same versions as
      # .github/actions/build-publish/action.yml. Two reasons they must not float here:
      #
      #   * This job writes the `type=gha` cache that the publish composite restores
      #     (action.yml `cache-from`). A hijacked mutable tag resolved at run time could
      #     poison those layers, and the publish path would then push and Sigstore-attest
      #     the result — every action in the composite being SHA-pinned does not help,
      #     because the poison enters through the shared cache, not an action reference.
      #   * A shared mode=max cache round-tripped between two BuildKit exporter
      #     generations degrades to misses, quietly voiding the warm-cache economics
      #     below. Drifting apart is a silent slowdown, not a failure.
      #
      # Keep the `# vX.Y.Z` comments — that is what Dependabot reads to bump the pins.
      # These two steps and the matching ones in the composite are one unit: bump both.
      #
      # Both actions run on Node 24 and require Actions Runner >= v2.327.1. Fine on
      # ubuntu-latest; check the runner version first if this job ever moves to a
      # self-hosted or ARC runner.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: octonomy:ci
          # GitHub Actions cache keeps the warm-cache rebuild to ~30-60s on a PR.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Assert manage.py check passes in the image
        # The image defaults to DJANGO_DEBUG=false, and config/settings.py refuses to
        # boot on an empty or default SECRET_KEY when DEBUG is False — so the smoke test
        # must pass a real DJANGO_SECRET_KEY + SERVICE_TOKEN_PEPPER and a sqlite
        # DATABASE_URL, the same way the test-sqlite job does. `check` reads settings
        # only (no DB), so the sqlite file is never actually created here.
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY=ci-docker-smoke-not-a-real-secret \
            -e SERVICE_TOKEN_PEPPER=ci-pepper \
            -e DATABASE_URL=sqlite:////tmp/octonomy-ci.sqlite3 \
            octonomy:ci python manage.py check
      - name: Start the container and assert /health/live
        # gunicorn auto-loads gunicorn.conf.py from /app, which binds 0.0.0.0:8000, so
        # the published port is reachable. /health/live needs no database. The entrypoint
        # runs `manage.py check` before serving, so a bad image never reaches this step.
        run: |
          set -euo pipefail
          docker run -d --name octonomy-ci \
            -e DJANGO_SECRET_KEY=ci-docker-smoke-not-a-real-secret \
            -e SERVICE_TOKEN_PEPPER=ci-pepper \
            -e DATABASE_URL=sqlite:////tmp/octonomy-ci.sqlite3 \
            -e OCTONOMY_ADMIN_ENABLED=true \
            -p 8000:8000 \
            octonomy:ci
          ready=0
          for _ in $(seq 1 30); do
            if ! docker ps --filter name=octonomy-ci --filter status=running --format '{{.Names}}' | grep -q octonomy-ci; then
              echo "::error::container exited during startup"
              break
            fi
            if curl -fsS http://localhost:8000/health/live >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::/health/live did not return 200 within the timeout"
            docker logs octonomy-ci || true
            exit 1
          fi
          echo "container is live:"
          curl -fsS http://localhost:8000/health/live
          echo
      - name: Assert the running image serves its static assets
        # Compensating control for decision dec-805139c7: the pytest suite runs the plain
        # staticfiles backend, so an image whose production manifest is missing or stale
        # passes every test job above. This step boots the real thing and asks it for the
        # assets its own pages reference — which is why the container above now starts with
        # OCTONOMY_ADMIN_ENABLED=true.
        #
        # It renders /admin/login/ and the browsable API and fetches a HASHED url out of
        # each, rather than probing a known filename: collectstatic writes both the original
        # and the hashed name, so an unhashed path answers 200 even with a broken manifest.
        # Scope is two pages, not every page — see the script header for what that does and
        # does not establish.
        #
        # Verified against real images by deleting the WhiteNoise middleware line (hashed
        # asset 404s) and by deleting collectstatic from the Dockerfile (the admin page
        # 500s); both make this step fail.
        #
        # Adds a couple of seconds and no credential: the container is already running, and
        # this is plain curl against localhost.
        run: ./scripts/assert-static-served.sh http://localhost:8000
      - name: Dump container logs when the smoke test failed
        if: failure()
        run: docker logs octonomy-ci || true
      - name: Trivy vulnerability scan (advisory)
        # Advisory only: findings go to the job summary and NEVER fail the build.
        # continue-on-error covers even a Trivy DB-download hiccup; exit-code stays 0.
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: octonomy:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-report.txt
          exit-code: "0"
      - name: Publish Trivy findings to the job summary
        # Advisory must stay advisory: continue-on-error keeps even a write failure from
        # reddening the job, and the report is bounded well under GitHub's 1 MiB step-
        # summary limit so a large scan can never make the append fail.
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## Trivy image scan (advisory)"
            echo
            echo "HIGH/CRITICAL vulnerabilities with a fix available. Informational — this scan never fails the build."
            echo
            echo '```'
            if [ -f trivy-report.txt ]; then
              head -c 500000 trivy-report.txt
              if [ "$(wc -c < trivy-report.txt)" -gt 500000 ]; then
                printf '\n... report truncated at 500 KB; see the Trivy step logs for the full output.\n'
              fi
            else
              echo "No Trivy report was produced."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Tear down the smoke-test container
        if: always()
        run: docker rm -f octonomy-ci >/dev/null 2>&1 || true
