name: Dependabot auto-merge

# Auto-enables merge for Dependabot minor and patch updates once required
# status checks pass. Major updates are intentionally left for manual review.
# Requires repo settings: "Allow auto-merge" enabled, and branch protection on
# the default branch requiring the CI checks (so auto-merge waits for green).

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        # SHA-pinned, not a mutable tag. This job holds `contents: write` and decides
        # whether a PR merges without human review, and the whole decision is one output
        # of this action — a repointed tag could report `semver-patch` for anything and
        # auto-merge it into main. Dependabot reads the version comment to bump the pin.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge for minor and patch updates
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch' }}
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
