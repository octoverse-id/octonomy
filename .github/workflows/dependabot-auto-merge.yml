name: Dependabot auto-merge

# Auto-enables merge for Dependabot minor and patch updates once required
# status checks pass. Major updates are intentionally left for manual review.
# Requires repo settings: "Allow auto-merge" enabled, and branch protection on
# the default branch requiring the CI checks (so auto-merge waits for green).

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        # SHA-pinned, not a mutable tag. This job holds `contents: write` and decides
        # whether a PR merges without human review, and the whole decision is one output
        # of this action — a repointed tag could report `semver-patch` for anything and
        # auto-merge it into main. Dependabot reads the version comment to bump the pin.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # An allowlist, not a denylist. `package-ecosystem != 'docker'` would fail OPEN:
      # a missing output is the empty string, which is != 'docker', so the base image
      # would auto-merge again with nothing to show that the gate had stopped applying.
      # Naming the ecosystems that MAY auto-merge means an absent output — or a newly
      # added ecosystem — fails closed and waits for a human.
      #
      # docker is not on the list because a base image tag bump reports as `semver-minor`:
      # python:3.12-slim -> 3.14-slim did exactly that and auto-merged as PR #134, so the
      # "majors get individual review" policy in dependabot.yml does not protect the
      # interpreter the production image ships. Gating it here rather than adding an
      # `ignore` rule to dependabot.yml is the safer half of the trade — every docker PR
      # still arrives, security digest bumps included, and only needs a human to click
      # merge. An `ignore` rule could suppress a digest patch outright, which is the
      # silent-inertness failure #132 was about.
      - name: Enable auto-merge for minor and patch updates
        # `github_actions` with an UNDERSCORE. Do not "correct" this to the hyphenated
        # `github-actions` that dependabot.yml uses — they are different strings from
        # different sources. fetch-metadata derives this output from the PR's branch name
        # (`packageEcosystem: chunks[1]`), and Dependabot names that path segment
        # `dependabot/github_actions/...`, so the metadata value is underscored while the
        # config key is hyphenated. `uv` and `docker` happen to be spelled the same in
        # both. Verified against this repo's own branches.
        #
        # Folded to one line by YAML: every continuation sits at the same indent as the
        # opening `${{`. Indenting them further would make YAML keep the newlines.
        if: >-
          ${{ (steps.metadata.outputs.package-ecosystem == 'uv'
          || steps.metadata.outputs.package-ecosystem == 'github_actions')
          && (steps.metadata.outputs.update-type == 'version-update:semver-minor'
          || steps.metadata.outputs.update-type == 'version-update:semver-patch') }}
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
