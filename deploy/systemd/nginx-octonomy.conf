# nginx reverse proxy for Octonomy. TLS is terminated here; Gunicorn listens on
# 127.0.0.1:8000. Install to /etc/nginx/sites-available/octonomy and symlink into
# sites-enabled, or drop into /etc/nginx/conf.d/.
#
# IMPORTANT: obtain the TLS certificate FIRST. The ssl_certificate paths below must
# already exist or `nginx -t` fails and nginx won't start. See docs/deployment.md VPS
# step 6 — run `certbot certonly` before enabling this config.
upstream octonomy {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    # Redirect to the FIXED canonical host, never $host: reflecting the client's Host
    # header here would be an open redirect to an attacker-supplied domain.
    return 301 https://api.example.com$request_uri;
}

# Optional hardening: drop requests with an unrecognized Host outright. Enable only if
# this server runs Octonomy alone — a second default_server on port 80 elsewhere makes
# `nginx -t` fail with "duplicate default server".
# server {
#     listen 80 default_server;
#     listen [::]:80 default_server;
#     server_name _;
#     return 444;
# }

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2: nginx >= 1.25.1 uses this directive. On older nginx, remove this line and
    # append `http2` to the listen directives instead: `listen 443 ssl http2;`.
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # TLS policy, spelled out rather than pulled from certbot's options-ssl-nginx.conf:
    # `certbot certonly` (what the guide uses) only issues the certificate, and that file
    # ships with the nginx *plugin* package, which the guide doesn't install — an `include`
    # of a missing file stops nginx from starting. Without these directives you inherit the
    # distro defaults, which on older nginx still negotiate TLSv1/TLSv1.1.
    # If you do install python3-certbot-nginx and prefer its managed policy, replace this
    # whole block with the include — do not keep both, or nginx -t fails on a duplicate
    # ssl_protocols directive.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:octonomy_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # This API is only ever served over TLS (port 80 redirects above), so pin clients to
    # HTTPS. Deliberately starts at 5 minutes: max-age is a commitment you cannot withdraw
    # early — clients honour the value they last saw, so a year-long header plus a cert
    # problem means a year of unreachable API with no way to fall back to HTTP. Confirm
    # renewals work, then raise it (86400 -> 2592000 -> 31536000 for a year). Add
    # `includeSubDomains`/`preload` only if you mean it for the whole domain, permanently.
    add_header Strict-Transport-Security "max-age=300" always;

    client_max_body_size 5m;

    # Only needed if you enable the optional admin console. Serve the collected admin
    # assets directly (run `manage.py collectstatic` on deploy). Harmless otherwise.
    location /static/ {
        alias /opt/octonomy/staticfiles/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://octonomy;
        proxy_http_version 1.1;
        # Forward the FIXED canonical host, never $host — same reasoning as the port-80
        # redirect above. This is the only 443 server block, so it is also nginx's implicit
        # default_server: a request carrying any Host lands here. Passing $host through would
        # hand Django an attacker-supplied Host, and ALLOWED_HOSTS must keep 127.0.0.1 for
        # local probes, so `Host: 127.0.0.1` from the internet would be accepted and echoed
        # back in absolute URLs (DRF pagination builds next/previous via build_absolute_uri).
        # If you serve several hostnames from this block, list them all in ALLOWED_HOSTS and
        # use $host — but then add a default_server that returns 444.
        proxy_set_header Host              api.example.com;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Lets Django/the admin see the original HTTPS scheme. If you enable the admin,
        # also set OCTONOMY_TRUST_FORWARDED_PROTO=true in the env file.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
