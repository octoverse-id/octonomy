# TEMPLATE ONLY — do not commit real secrets. Prefer creating the Secret imperatively
# or via a sealed-secrets / external-secrets operator instead of a plaintext manifest:
#
#   kubectl -n octonomy create secret generic octonomy-secrets \
#     --from-literal=DJANGO_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(64))')" \
#     --from-literal=SERVICE_TOKEN_PEPPER="$(python -c 'import secrets;print(secrets.token_urlsafe(64))')" \
#     --from-literal=DATABASE_URL="postgres://octonomy:PASSWORD@db-host:5432/octonomy"
#
# If you apply this file instead, fill in real values first. The service refuses to
# boot when DJANGO_DEBUG=false and DJANGO_SECRET_KEY / SERVICE_TOKEN_PEPPER are missing
# or left at their local-dev defaults.
apiVersion: v1
kind: Secret
metadata:
  name: octonomy-secrets
  namespace: octonomy
type: Opaque
stringData:
  # Left empty on purpose — applying this file as-is makes the app fail to boot rather
  # than run on a publicly-known secret. Fill in real values, or (preferred) create the
  # Secret imperatively with the command above so real secrets never live in a manifest.
  DJANGO_SECRET_KEY: ""
  SERVICE_TOKEN_PEPPER: ""
  DATABASE_URL: "postgres://octonomy:CHANGE_ME@db-host:5432/octonomy"
  # Only if OCTONOMY_OUTBOX_TRANSPORT=webhook:
  # OCTONOMY_WEBHOOK_SIGNING_SECRET: "CHANGE_ME"
